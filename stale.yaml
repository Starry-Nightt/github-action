name: Stale Issues & Prs
on:
  schedule:
    - cron: "0 * * * *"
    - cron: "0/5 * * * *"
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v8
        with:
          stale-issue-message: "This is some messages."
          days-before-stale: 1
          days-before-close: 5