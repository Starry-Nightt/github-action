name: Enviroments variables
on: [push]

env:
  WF_LEVEL_ENV: Available to all jobs

jobs:
  env-vars-and-context:
    runs-on: ubuntu-latest
    env: 
      JOB_LEVEL_ENV: Available to all steps
    steps:
      - name: Log env variables
        run: echo $GITHUB_REF
      - name: Log context
        run: echo '${{github.ref}}'
      - name: Log custom env
        env:
          STEP_LEVEL_ENV: Available only this step
        run: |
          echo '${{ env.WF_LEVEL_ENV }}'
          echo '${{ env.JOB_LEVEL_ENV }}'
          echo '${{ env.STEP_LEVEL_ENV }}'