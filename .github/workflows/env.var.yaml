name: Enviroments variables
on: [push]

env:
  WF_LEVEL_ENV: Available to all jobs


jobs:
  env-vars-and-context:
    runs-on: ubuntu-latest
    environment: "development"
    env: 
      JOB_LEVEL_ENV: Available to all steps
    steps:
      - name: Log env variables
        run: echo $GITHUB_REF
      - name: Log context
        run: echo '${{github.ref}}'
      - name: Log custom env
        env:
          STEP_LEVEL_ENV: Available only this step
        run: |
          echo '${{ env.WF_LEVEL_ENV }}'
          echo '${{ env.JOB_LEVEL_ENV }}'
          echo '${{ env.STEP_LEVEL_ENV }}'
          echo '${{ toJSON(secrets)}}'
          echo '${{ toJSON(vars)}}'

  custom-env-github:
    environment: "development"
    runs-on: ${{secrets.RUNNER}}
    env:
      NODE_ENV: ${{vars.NODE_ENV}}
      SECRET_KEY: ${{secrets.SECRET_KEY}}
      REPO_ENV: ${{vars.REPO_ENV}}
      RUNNER: ${{secrets.RUNNER}}
    steps:
      - name: Log env var and secret
        run: |
          echo '${{env.NODE_ENV}}'
          echo '${{env.SECRET_KEY}}'
          echo '${{env.REPO_ENV}}'
          echo '${{env.RUNNER}}'
      