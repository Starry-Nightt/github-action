name: Simple action
on: 
  push: 
    branches:
      - main
      - "feature/*"
      - feat/*
jobs:
  simple-action:
    runs-on: ubuntu-latest
    steps:
      - name: Simple JS action
        id: greet
        uses: actions/hello-world-javascript-action@main
        with:
          who-to-greet: Tien
      - name: Log Greeting
        run: echo "${{steps.greet.outputs.time}}"
